name: Compact Pages data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: compact-pages-data
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Test lossless compaction and catalog integrity
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Compact and validate every data file
        run: python3 .github/scripts/compact_pages.py .
      - name: Commit compact data without overwriting concurrent edits
        id: commit
        run: |
          git add -- '*.json' '*.jsonl'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compact Pages JSON without changing archived text or URLs'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request Pages build for the compacted commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" --jq '{status, url}'
